[package]
name = "shiroha-quiz-desktop"
version = "0.1.0"
description = "Shiroha Quiz Windows prototype"
edition = "2021"
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "backup"] }
rfd = { version = "=0.17.2", default-features = false }
uuid = { version = "1", features = ["v4"] }
url = "=2.5.8"
quick-xml = "=0.42.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "json"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Security_Credentials", "Win32_Security_Isolation", "Win32_Security_Authorization", "Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
native-test = []
codebuddy-prototype = []

[[example]]
name = "codebuddy-native-probe"
required-features = ["codebuddy-prototype"]
