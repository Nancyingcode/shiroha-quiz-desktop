name: Windows desktop checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      collect_release:
        description: Preserve verified Windows release assets for the caller
        type: boolean
        default: false
      release_commit:
        description: Resolved release commit from the caller's tag validation
        type: string
        default: ''

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-2025
    env:
      HUSKY: '0'
      RELEASE_COMMIT: ${{ inputs.release_commit }}
    defaults:
      run:
        working-directory: apps/desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Initialize release collection
        if: inputs.collect_release == true
        run: node scripts/release-artifacts.mjs init
      - name: Install recorded Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          shared-key: windows-2025-x64
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci --no-audit --no-fund
      - name: Check pull request commit messages
        if: github.event_name == 'pull_request'
        env:
          COMMITLINT_FROM: ${{ github.event.pull_request.base.sha }}
          COMMITLINT_TO: ${{ github.event.pull_request.head.sha }}
        run: npm run commitlint -- --from "$env:COMMITLINT_FROM" --to "$env:COMMITLINT_TO" --verbose
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:web-platform
      - run: npm run test:documents
      - run: node --test ../../test/web-webdav/request.test.cjs
      - run: npm run prepare:web
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --features native-test -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --features native-test
      - run: npm run build -- --target x86_64-pc-windows-msvc
      - name: Preserve standalone executable
        if: inputs.collect_release == true
        run: node scripts/release-artifacts.mjs stage exe
      - run: npm run bundle:nsis
      - name: Preserve online installer before offline build overwrites it
        if: inputs.collect_release == true
        run: node scripts/release-artifacts.mjs stage nsis
      - run: npm run bundle:offline
      - name: Preserve offline installer and verify release assets
        if: inputs.collect_release == true
        run: |
          node scripts/release-artifacts.mjs stage offline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/release-artifacts.mjs finalize
      - name: Upload verified release assets
        if: inputs.collect_release == true
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/desktop/.reports/desktop-release/${{ github.run_id }}-${{ github.run_attempt }}/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: GUI acceptance remains a separate release gate
        run: |
          '### 尚待交互式 Windows 验收' >> $env:GITHUB_STEP_SUMMARY
          '本 job 仅验证构建和无界面测试。WebView2、中文离线 OCR、新装、升级与卸载保留必须按阶段 E 记录在隔离 Windows 环境验收；CI 通过不代表发行验收通过。' >> $env:GITHUB_STEP_SUMMARY
